name: ❓ Question / Help
description: Ask a question about KryptoLuck or get help with usage
title: "[Question]: "
labels: ["question", "help-wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about KryptoLuck? Need help understanding the code or concepts? We're here to help!
        
        **Please note**: This project is educational and demonstrates the mathematical impossibility of brute-force wallet discovery. The probability of finding a funded wallet is astronomically low (1 in 2^160).

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you have checked the following resources first
      options:
        - label: I have read the [README.md](../README.md) including the FAQ section
          required: true
        - label: I have checked the [CONTRIBUTING.md](../CONTRIBUTING.md) for development questions
          required: true
        - label: I have searched existing issues for similar questions
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What type of question do you have?
      options:
        - Setup and installation
        - Usage and configuration
        - Understanding the mathematics/probability
        - Code explanation and architecture
        - Educational concepts and learning
        - Performance and optimization
        - Legal and ethical considerations
        - Contributing and development
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Please ask your question clearly and provide context
      placeholder: |
        What would you like to know? Please be as specific as possible.
        
        Examples:
        - How does the key generation algorithm work?
        - Why is the probability so low?
        - How can I modify the search parameters?
        - What does this error message mean?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Provide any relevant background information
      placeholder: |
        - What are you trying to accomplish?
        - What have you tried so far?
        - What specific part confuses you?
        - Are there any error messages?

  - type: textarea
    id: environment
    attributes:
      label: Environment (if relevant)
      description: If this is a technical question, please provide your environment details
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, Windows 11, macOS 13]
        - Node.js version: [run `node --version`]
        - Mode: [online/offline]
        - Configuration: [any relevant settings]

  - type: checkboxes
    id: understanding
    attributes:
      label: Educational Goals
      description: What are you hoping to learn or understand better?
      options:
        - label: How cryptographic key generation works
        - label: The mathematics behind probability calculations
        - label: Why brute force attacks are impractical
        - label: How Ethereum addresses are derived from private keys
        - label: The relationship between key space and security
        - label: Performance optimization techniques
        - label: Code architecture and design patterns

  - type: dropdown
    id: experience
    attributes:
      label: Experience Level
      description: This helps us provide an appropriate level of explanation
      options:
        - Beginner - new to cryptography and programming
        - Intermediate - some experience with crypto concepts
        - Advanced - experienced with cryptography and blockchain
        - Expert - deep technical knowledge
    validations:
      required: true